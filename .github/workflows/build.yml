# Builds Nous PDF for Windows (installer), macOS (Apple Silicon + Intel) and
# Linux (.deb for Mint/Ubuntu/Debian).
#
# Runs when you push a version tag, or when you press "Run workflow" on the
# repo's Actions tab. Not on every push: Mac minutes are expensive.
#
#   1. put the new version in the VERSION file (e.g. 0.2.1) and commit
#   2. git tag v0.2.1 && git push && git push --tags
#
# A tag run also publishes a GitHub Release with NousPDF-Setup.exe, the two
# Mac zips and NousPDF-linux-amd64.deb. "Run workflow" only builds (files under Artifacts).

name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    if: false  # TEMP linux-prune
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.txt
          choco install innosetup -y --no-progress

      - name: Test (page editing)
        run: .venv\Scripts\python.exe tests\test_pages.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test (find, merge, text selection)
        continue-on-error: true
        run: |
          .venv\Scripts\python.exe tests\test_find_merge.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe tests\test_select.py

      - name: Build app + installer
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Check the installer (install, open a PDF, uninstall)
        run: |
          $ErrorActionPreference = "Stop"
          $app = "$env:LOCALAPPDATA\Programs\Nous PDF"
          Start-Process installer-output\NousPDF-Setup.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=desktopicon"
          foreach ($p in "$app\NousPDF.exe", "$app\_internal",
                         "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Nous PDF.lnk",
                         "$env:USERPROFILE\Desktop\Nous PDF.lnk") {
            if (-not (Test-Path $p)) { throw "missing after install: $p" }
          }
          $owp = Get-ItemProperty "HKCU:\Software\Classes\.pdf\OpenWithProgids"
          if (-not ($owp.PSObject.Properties.Name -contains "NousPDF.Document")) { throw "not in Open with" }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\NousPDF.Document\shell\open\command")."(default)"
          if ($cmd -ne "`"$app\NousPDF.exe`" `"%1`"") { throw "bad open command: $cmd" }
          if (-not (Get-ItemProperty "HKCU:\Software\RegisteredApplications")."Nous PDF") { throw "not in Default apps" }
          $ver = (Get-Item "$app\NousPDF.exe").VersionInfo
          Write-Host "Installed: $($ver.FileDescription) $($ver.FileVersion)"

          .venv\Scripts\python.exe -c "import pymupdf; d=pymupdf.open(); d.new_page().insert_text((72,72),'hello'); d.save('ci-sample.pdf')"
          $proc = Start-Process "$app\NousPDF.exe" -ArgumentList "`"$PWD\ci-sample.pdf`"" -PassThru
          Start-Sleep 10
          if ($proc.HasExited) { throw "Nous PDF exited right after opening a PDF (code $($proc.ExitCode))" }
          Write-Host "Running after 10s, window: '$((Get-Process -Id $proc.Id).MainWindowTitle)'"
          Stop-Process -Id $proc.Id -Force
          Start-Sleep 2

          Start-Process "$app\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\NousPDF.exe"); $i++) { Start-Sleep 1 }
          foreach ($p in "$app\NousPDF.exe", "$env:USERPROFILE\Desktop\Nous PDF.lnk",
                         "HKCU:\Software\Classes\NousPDF.Document", "HKCU:\Software\Nous PDF") {
            if (Test-Path $p) { throw "left behind after uninstall: $p" }
          }
          if ((Get-ItemProperty "HKCU:\Software\RegisteredApplications" -ErrorAction SilentlyContinue)."Nous PDF") { throw "Default apps entry left behind" }
          Write-Host "Install, launch and uninstall all OK"

      - uses: actions/upload-artifact@v4
        with:
          name: NousPDF-windows
          path: installer-output/NousPDF-Setup.exe
          retention-days: 30

  linux:
    # Built on an older Ubuntu so the package runs on Linux Mint 21+ / Ubuntu 22.04+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1 xvfb xdotool desktop-file-utils
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Test (page editing)
        run: .venv/bin/python tests/test_pages.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test (find, merge, text selection)
        continue-on-error: true
        run: |
          xvfb-run -a .venv/bin/python tests/test_find_merge.py
          xvfb-run -a .venv/bin/python tests/test_select.py

      - name: Build .deb
        run: |
          bash build_linux.sh
          mv nous-pdf_*_amd64.deb NousPDF-linux-amd64.deb

      - name: TEMP largest files
        run: |
          ls -l NousPDF-linux-amd64.deb
          du -sh dist/NousPDF build/deb/opt/nous-pdf
          find dist/NousPDF -type f -printf '%s %p\n' | sort -rn | head -60
          du -sk dist/NousPDF/_internal/* dist/NousPDF/_internal/PySide6/* dist/NousPDF/_internal/PySide6/Qt/* dist/NousPDF/_internal/PySide6/Qt/plugins/* 2>/dev/null | sort -rn | head -60

      - name: Check the .deb (install, open a PDF, uninstall)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ./NousPDF-linux-amd64.deb
          dpkg -s nous-pdf | grep -E "^(Version|Installed-Size):"
          test -x /usr/bin/nous-pdf
          desktop-file-validate /usr/share/applications/nous-pdf.desktop
          grep "application/pdf=.*nous-pdf.desktop" /usr/share/applications/mimeinfo.cache
          test -f /usr/share/icons/hicolor/256x256/apps/nous-pdf.png

          .venv/bin/python -c "import pymupdf; d=pymupdf.open(); d.new_page().insert_text((72,72),'hello'); d.save('ci-sample.pdf')"
          xvfb-run -a bash -c '
            nous-pdf ci-sample.pdf & pid=$!
            sleep 10
            kill -0 $pid || { echo "nous-pdf exited early"; exit 1; }
            title=$(xdotool search --name "ci-sample.pdf" getwindowname | head -1)
            echo "window: $title"
            kill $pid
            [ -n "$title" ]'

          sudo apt-get remove -y -qq nous-pdf
          test ! -e /usr/bin/nous-pdf && test ! -e /opt/nous-pdf
          ! grep -q "nous-pdf.desktop" /usr/share/applications/mimeinfo.cache
          echo "Install, launch and uninstall all OK"

      - uses: actions/upload-artifact@v4
        with:
          name: NousPDF-linux
          path: NousPDF-linux-amd64.deb
          retention-days: 30

  mac:
    if: false  # TEMP linux-prune
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1 and newer)
            arch: apple-silicon
          - runner: macos-15-intel    # older Intel Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -r requirements.txt pillow

      - name: Test (page editing)
        run: python tests/test_pages.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test (find, merge, text selection)
        continue-on-error: true
        run: |
          python tests/test_find_merge.py
          python tests/test_select.py

      - name: Build
        run: python -m PyInstaller --noconfirm --clean NousPDF-mac.spec

      - name: Check the app starts
        run: |
          "dist/Nous PDF.app/Contents/MacOS/NousPDF" &
          pid=$!
          sleep 8
          kill -0 $pid && echo "still running after 8s" && kill $pid

      - name: Zip
        # ditto keeps the app's symlinks and signature intact (a plain zip breaks them)
        run: ditto -c -k --keepParent "dist/Nous PDF.app" "NousPDF-mac-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NousPDF-mac-${{ matrix.arch }}
          path: NousPDF-mac-${{ matrix.arch }}.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches VERSION file
        run: |
          want="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match VERSION ($want)"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Nous PDF ${{ github.ref_name }}
          files: release-files/*
          body: |
            **Windows:** download `NousPDF-Setup.exe` and open it.
            **Mac:** `NousPDF-mac-apple-silicon.zip` for M1 and newer, `NousPDF-mac-intel.zip` for Intel Macs.
            **Linux (Mint, Ubuntu, Debian):** download `NousPDF-linux-amd64.deb` and double-click it, or `sudo apt install ./NousPDF-linux-amd64.deb`.

            Step-by-step instructions (including the one-time security warnings): https://nouspdf.lionthroat.com
