# Builds "Nous PDF.app" on GitHub's Mac machines, for Apple Silicon and Intel.
#
# Runs when you push a version tag (git tag v0.1.1 && git push --tags) or when
# you press "Run workflow" on the repo's Actions tab. Not on every push: Mac
# minutes count 10x against a private repo's free allowance.
#
# The result is under the run's "Artifacts" on the Actions tab. GitHub wraps it
# in one more zip; inside is NousPDF-mac-<arch>.zip, which is the file to send.

name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1 and newer)
            arch: apple-silicon
          - runner: macos-15-intel    # older Intel Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -r requirements.txt pillow

      - name: Test (page editing)
        run: python tests/test_pages.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test (find, merge, text selection)
        # These open real windows; a CI Mac may not let them take focus, so a
        # failure here is reported but doesn't block the build.
        continue-on-error: true
        run: |
          python tests/test_find_merge.py
          python tests/test_select.py

      - name: Build
        run: python -m PyInstaller --noconfirm --clean NousPDF-mac.spec

      - name: Check the app starts
        run: |
          "dist/Nous PDF.app/Contents/MacOS/NousPDF" &
          pid=$!
          sleep 8
          kill -0 $pid && echo "still running after 8s" && kill $pid

      - name: Zip
        # ditto keeps the app's symlinks and signature intact (a plain zip breaks them)
        run: ditto -c -k --keepParent "dist/Nous PDF.app" "NousPDF-mac-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NousPDF-mac-${{ matrix.arch }}
          path: NousPDF-mac-${{ matrix.arch }}.zip
          retention-days: 30
